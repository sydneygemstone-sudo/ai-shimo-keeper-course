<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
    <!-- 通用渐变 -->
    <radialGradient id="mqBody" cx="0.35" cy="0.27" r="0.9">
      <stop offset="0" stop-color="#FFFAEF"/><stop offset="0.3" stop-color="#FFE0B0"/>
      <stop offset="0.72" stop-color="#E89C50"/><stop offset="1" stop-color="#A45A1E"/>
    </radialGradient>
    <radialGradient id="mqLimb" cx="0.38" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#FFE9C4"/><stop offset="0.7" stop-color="#EFA85C"/><stop offset="1" stop-color="#B06426"/>
    </radialGradient>
    <radialGradient id="mqEye" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fff"/><stop offset="0.28" stop-color="#6EE7FF"/>
      <stop offset="0.7" stop-color="#2A1B52"/><stop offset="1" stop-color="#120A2E"/>
    </radialGradient>
    <radialGradient id="mqGloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.92"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mqBlush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A6B" stop-opacity="0.6"/><stop offset="1" stop-color="#FF8A6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mqRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE6FF" stop-opacity="0.9"/><stop offset="0.7" stop-color="#CFE6FF" stop-opacity="0.1"/><stop offset="1" stop-color="#CFE6FF" stop-opacity="0"/>
    </linearGradient>

    <!-- 共用：身体+耳朵+呆毛+手脚+高光+腮红（含 happy 用的 rest 手） -->
    <g id="mqBase">
      <ellipse cx="100" cy="184" rx="67" ry="11" fill="rgba(80,40,20,0.28)"/>
      <ellipse cx="66" cy="176" rx="16" ry="10" fill="url(#mqLimb)" stroke="#5A2410" stroke-width="1.8" stroke-opacity="0.35"/>
      <ellipse cx="134" cy="176" rx="16" ry="10" fill="url(#mqLimb)" stroke="#5A2410" stroke-width="1.8" stroke-opacity="0.35"/>
      <ellipse cx="24" cy="124" rx="10" ry="13" fill="url(#mqLimb)" stroke="#5A2410" stroke-width="1.8" stroke-opacity="0.35" transform="rotate(14 24 124)"/>
      <ellipse cx="176" cy="124" rx="10" ry="13" fill="url(#mqLimb)" stroke="#5A2410" stroke-width="1.8" stroke-opacity="0.35" transform="rotate(-14 176 124)"/>
      <ellipse cx="100" cy="108" rx="80" ry="72" fill="url(#mqBody)"/>
      <ellipse cx="100" cy="108" rx="80" ry="72" fill="none" stroke="#5A2410" stroke-width="2.2" stroke-opacity="0.45"/>
      <path d="M 24 110 A 77 69 0 0 1 176 110" fill="none" stroke="url(#mqRim)" stroke-width="5" stroke-linecap="round" style="mix-blend-mode:screen"/>
      <path d="M 66 50 C 56 18, 80 14, 84 34" fill="url(#mqBody)" stroke="#5A2410" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round"/>
      <path d="M 134 50 C 144 18, 120 14, 116 34" fill="url(#mqBody)" stroke="#5A2410" stroke-width="2" stroke-opacity="0.4" stroke-linejoin="round"/>
      <path d="M 97 42 C 92 22, 102 10, 110 16 C 103 20, 104 32, 104 43 Z" fill="url(#mqBody)" stroke="#5A2410" stroke-width="1.8" stroke-opacity="0.4" stroke-linejoin="round"/>
      <path d="M 54 78 Q 74 52 106 59 Q 78 65 62 86 Z" fill="url(#mqGloss)" opacity="0.55"/>
      <circle cx="132" cy="84" r="5" fill="#fff" opacity="0.55"/>
    </g>

    <!-- happy：眨眼笑脸 + 眉上扬 + 大微笑 -->
    <symbol id="mq-happy" viewBox="0 0 200 200" overflow="visible">
      <use href="#mqBase"/>
      <g opacity="0.55"><ellipse cx="54" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/><ellipse cx="146" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/></g>
      <g stroke="#5A2410" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75">
        <path d="M 62 81 Q 72 74 82 79"/><path d="M 138 81 Q 128 74 118 79"/></g>
      <ellipse cx="72" cy="104" rx="20.5" ry="18.6" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="72" cy="104" rx="17.1" ry="17.1" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="66.5" cy="97.8" r="5.1" fill="#fff"/><circle cx="77.8" cy="107.4" r="2.4" fill="#fff" opacity="0.85"/>
      <ellipse cx="128" cy="104" rx="20.5" ry="18.6" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="128" cy="104" rx="17.1" ry="17.1" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="122.5" cy="97.8" r="5.1" fill="#fff"/><circle cx="133.8" cy="107.4" r="2.4" fill="#fff" opacity="0.85"/>
      <path d="M 82 135 Q 100 151 118 135" fill="none" stroke="#5A2410" stroke-width="3.4" stroke-linecap="round"/>
    </symbol>

    <!-- idle：平静小微笑 -->
    <symbol id="mq-idle" viewBox="0 0 200 200" overflow="visible">
      <use href="#mqBase"/>
      <g opacity="0.42"><ellipse cx="54" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/><ellipse cx="146" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/></g>
      <ellipse cx="72" cy="104" rx="20.5" ry="17.1" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="72" cy="104" rx="15.6" ry="15.6" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="67" cy="98.4" r="4.7" fill="#fff"/><circle cx="77.3" cy="107.1" r="2.2" fill="#fff" opacity="0.85"/>
      <ellipse cx="128" cy="104" rx="20.5" ry="17.1" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="128" cy="104" rx="15.6" ry="15.6" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="123" cy="98.4" r="4.7" fill="#fff"/><circle cx="133.3" cy="107.1" r="2.2" fill="#fff" opacity="0.85"/>
      <path d="M 88 136 Q 100 145 112 136" fill="none" stroke="#5A2410" stroke-width="3.2" stroke-linecap="round"/>
    </symbol>

    <!-- excited：张嘴大笑 + 圆睁大眼 -->
    <symbol id="mq-excited" viewBox="0 0 200 200" overflow="visible">
      <use href="#mqBase"/>
      <g opacity="0.6"><ellipse cx="54" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/><ellipse cx="146" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/></g>
      <g stroke="#5A2410" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75">
        <path d="M 62 80 Q 72 73 82 78"/><path d="M 138 80 Q 128 73 118 78"/></g>
      <ellipse cx="72" cy="104" rx="20.5" ry="20.5" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="72" cy="104" rx="21" ry="21" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="65.3" cy="96.4" r="6.3" fill="#fff"/><circle cx="79.1" cy="108.2" r="2.9" fill="#fff" opacity="0.85"/>
      <ellipse cx="128" cy="104" rx="20.5" ry="20.5" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="128" cy="104" rx="21" ry="21" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="121.3" cy="96.4" r="6.3" fill="#fff"/><circle cx="135.1" cy="108.2" r="2.9" fill="#fff" opacity="0.85"/>
      <path d="M 85 133 Q 100 127 115 133 Q 117 150 100 153 Q 83 150 85 133 Z" fill="#7A2418" stroke="#5A2410" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 90 145 Q 100 154 110 145 Q 100 152 90 145 Z" fill="#FF8A8A"/>
    </symbol>
  </defs>

      <use href="#mqBase"/>
      <g opacity="0.6"><ellipse cx="54" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/><ellipse cx="146" cy="122" rx="13" ry="8" fill="url(#mqBlush)"/></g>
      <g stroke="#5A2410" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75">
        <path d="M 62 80 Q 72 73 82 78"/><path d="M 138 80 Q 128 73 118 78"/></g>
      <ellipse cx="72" cy="104" rx="20.5" ry="20.5" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="72" cy="104" rx="21" ry="21" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="65.3" cy="96.4" r="6.3" fill="#fff"/><circle cx="79.1" cy="108.2" r="2.9" fill="#fff" opacity="0.85"/>
      <ellipse cx="128" cy="104" rx="20.5" ry="20.5" fill="#FFFAEF" opacity="0.9"/>
      <ellipse cx="128" cy="104" rx="21" ry="21" fill="url(#mqEye)" stroke="#120A2E" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="121.3" cy="96.4" r="6.3" fill="#fff"/><circle cx="135.1" cy="108.2" r="2.9" fill="#fff" opacity="0.85"/>
      <path d="M 85 133 Q 100 127 115 133 Q 117 150 100 153 Q 83 150 85 133 Z" fill="#7A2418" stroke="#5A2410" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 90 145 Q 100 154 110 145 Q 100 152 90 145 Z" fill="#FF8A8A"/>
    
</svg>